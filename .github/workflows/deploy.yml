name: Проверка каталога и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Проверка данных каталога
    runs-on: ubuntu-latest
    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверка data/catalog.json
        run: node scripts/validate.js data/catalog.json

  deploy:
    name: Публикация на GitHub Pages
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Загрузка репозитория
        uses: actions/checkout@v4

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Загрузка файлов сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
