<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecuTar Help — каталог полезных ресурсов для инженера систем безопасности</title>
  <meta name="description" content="Структурированный каталог полезных интернет-ресурсов для инженеров систем безопасности: видеонаблюдение, СКУД, ОПС, сети, серверы и хранилища, книги и инструменты.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdf6e3">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#002b36">
  <meta property="og:title" content="SecuTar Help — каталог полезных ресурсов">
  <meta property="og:description" content="Полезные интернет-ресурсы для инженеров систем безопасности: видеонаблюдение, СКУД, ОПС, сети, серверы, инструменты и документация.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://help.secutar.org/">
  <link rel="canonical" href="https://help.secutar.org/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>

  <header class="site-header">
    <button id="menu-toggle" class="icon-btn menu-toggle" type="button"
            aria-expanded="false" aria-controls="sidebar" aria-label="Открыть меню категорий">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <span>Меню</span>
    </button>

    <a class="brand" href="#/">SecuTar<span class="brand-accent"> Help</span></a>

    <div class="theme-switch" role="group" aria-label="Тема оформления">
      <button type="button" class="theme-btn" data-theme-mode="system" title="Системная тема" aria-label="Системная тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-theme-mode="light" title="Светлая тема" aria-label="Светлая тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-theme-mode="dark" title="Тёмная тема" aria-label="Тёмная тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <div id="overlay" class="overlay" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="Навигация по категориям">
      <nav id="tree" class="tree" aria-label="Дерево категорий"></nav>
      <div class="side-block">
        <h2 class="side-title">Теги</h2>
        <div id="tag-cloud" class="tag-cloud"></div>
      </div>
    </aside>

    <main id="content" class="content" tabindex="-1">
      <div class="search-row">
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Поиск по названиям, описаниям, доменам и тегам…"
               aria-label="Поиск по каталогу">
      </div>

      <div id="filters" class="filters" hidden></div>

      <div class="cat-head">
        <h1 id="cat-title" class="cat-title"></h1>
        <button id="copy-link" class="btn-copy" type="button" title="Скопировать ссылку на текущую категорию">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 10a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
          </svg>
          Копировать ссылку
        </button>
      </div>
      <p id="results-info" class="results-info"></p>

      <section id="resource-list" class="resource-list" aria-live="polite"></section>
    </main>
  </div>

  <footer class="site-footer">
    <span>SecuTar Help</span>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/avelender/help" target="_blank" rel="noopener noreferrer">Репозиторий</a>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
